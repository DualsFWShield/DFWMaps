<!doctype html>
<html lang="fr" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mon Maps · Navigation & Itinéraires</title>
  <meta name="description" content="Application cartographique moderne, calcul d'itinéraires et guidage vocal en temps réel.">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mon Maps">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- Panneau principal d'itinéraire -->
  <section id="panel" aria-label="Calcul d'itinéraire">
    <header class="panel-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Mon Maps</h1>
          <span class="brand-badge">GPS & Trajets</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Changer de thème" title="Changer de thème">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="route-inputs-card">
      <div class="timeline-connector" aria-hidden="true">
        <div class="connector-dot from-dot"></div>
        <div class="connector-line"></div>
        <div class="connector-dot to-dot"></div>
      </div>

      <div class="inputs-stack">
        <div class="field">
          <div class="input-wrapper">
            <input id="from" placeholder="Point de départ ou adresse…" autocomplete="off" aria-label="Point de départ">
            <button id="clear-from" class="clear-btn" type="button" aria-label="Effacer le départ" title="Effacer" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <button id="locate" class="field-action-btn" type="button" aria-label="Utiliser ma position actuelle" title="Ma position actuelle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="2" fill="currentColor"/>
            </svg>
          </button>
          <ul id="from-list" class="suggest" hidden></ul>
        </div>

        <div class="field">
          <div class="input-wrapper">
            <input id="to" placeholder="Destination d'arrivée…" autocomplete="off" aria-label="Destination d'arrivée">
            <button id="clear-to" class="clear-btn" type="button" aria-label="Effacer l'arrivée" title="Effacer" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <button id="swap" class="field-action-btn" type="button" aria-label="Inverser départ et arrivée" title="Inverser départ et arrivée">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
          </button>
          <ul id="to-list" class="suggest" hidden></ul>
        </div>
      </div>
    </div>

    <div id="modes" role="tablist" aria-label="Mode de transport">
      <button type="button" data-mode="car" role="tab" aria-pressed="true" aria-selected="true" class="mode-btn">
        <span class="mode-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H7c-.7 0-1.4.3-1.8.8L3 10.1C2.4 10.5 2 11.2 2 12v4c0 .6.4 1 1 1h2"/>
            <circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M5 17h10"/>
          </svg>
        </span>
        <b class="mode-title">Voiture</b>
        <small class="mode-time">–</small>
      </button>

      <button type="button" data-mode="bike" role="tab" aria-pressed="false" aria-selected="false" class="mode-btn">
        <span class="mode-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5L9 11l4-3 3 3h4M12 17.5V14"/>
          </svg>
        </span>
        <b class="mode-title">Vélo</b>
        <small class="mode-time">–</small>
      </button>

      <button type="button" data-mode="foot" role="tab" aria-pressed="false" aria-selected="false" class="mode-btn">
        <span class="mode-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 4a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM7 21l3-7 2 3 4 5M15 13l-2-4-3 1-2 4M10 8l3-2 3 2"/>
          </svg>
        </span>
        <b class="mode-title">À pied</b>
        <small class="mode-time">–</small>
      </button>
    </div>

    <p id="status" role="status">Cherchez une adresse ou touchez la carte pour placer un point.</p>

    <div id="route-box" hidden>
      <div class="route-overview-card">
        <div class="route-stats">
          <div class="stat-primary">
            <span id="route-duration-hero" class="duration-hero">--</span>
            <span id="route-eta-hero" class="eta-pill">Arrivée --:--</span>
          </div>
          <div class="stat-secondary">
            <span id="route-distance-hero" class="distance-hero">-- km</span>
          </div>
        </div>

        <button id="start" type="button" class="btn-primary-action">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="start-icon" aria-hidden="true">
            <polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>
          </svg>
          <span>Démarrer le guidage</span>
        </button>
      </div>

      <details id="steps-wrap" open>
        <summary id="summary">
          <span class="summary-label">Feuille de route</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </summary>
        <ol id="steps"></ol>
      </details>
    </div>
  </section>

  <!-- Bannière de guidage en direct (HUD) -->
  <div id="banner" aria-live="polite">
    <div class="banner-icon-badge" id="banner-icon-wrap" aria-hidden="true">
      <svg id="banner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </div>
    <div class="banner-content">
      <b id="banner-dist">-- m</b>
      <span id="banner-text">En attente du signal GPS…</span>
    </div>
  </div>

  <!-- Boutons flottants d'actions (FAB) -->
  <div id="fab">
    <button id="layers" class="fab-btn round" type="button" aria-pressed="false" title="Vue satellite" aria-label="Basculer la vue satellite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="12 2 2 7 12 12 22 7 12 2"/>
        <polyline points="2 17 12 22 22 17"/>
        <polyline points="2 12 12 17 22 12"/>
      </svg>
    </button>
    <button id="recenter" class="fab-btn pill" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor"/>
      </svg>
      <span>Recentrer</span>
    </button>
    <button id="install" class="fab-btn pill install-pill" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
      </svg>
      <span>Installer l'app</span>
    </button>
  </div>

  <!-- Barre de navigation inférieure lors du guidage -->
  <div id="navbar">
    <div class="navbar-eta-card">
      <div id="eta">--:--</div>
      <div class="eta-sub" id="eta-sub">Calcul…</div>
    </div>
    <div class="navbar-controls">
      <button id="mute" class="fab-btn round" type="button" aria-pressed="true" aria-label="Guidage vocal" title="Guidage vocal">
        <svg class="sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <svg class="sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
      <button id="stop" type="button" class="btn-stop-nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
        </svg>
        <span>Arrêter</span>
      </button>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
